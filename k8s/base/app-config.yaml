apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-app-cfgmap
data:
  # scripts/deploy-k8s-app.sh replaces this with APP_DB_HOST from .env.
  DB_HOST: 192.168.180.1
  DB_PORT: "5432"
  DB_NAME: todo
  DB_CREDENTIAL_USERNAME_FILE: /var/run/secrets/database-credentials/username
  DB_CREDENTIAL_PASSWORD_FILE: /var/run/secrets/database-credentials/password
  DB_CREDENTIAL_PROVIDER_FILE: /var/run/secrets/database-credentials/managed_by
  DB_CREDENTIAL_SECRET_NAME: todo-database-credentials
  DB_CREDENTIAL_POLL_INTERVAL: 2s
  # Phase 2 estimates; keep aligned with VaultDynamicSecret and Vault DB role.
  DB_CREDENTIAL_LEASE_DURATION: 30s
  DB_CREDENTIAL_RENEWAL_PERCENT: "67"
  DB_CREDENTIAL_MAX_TTL: 2m
