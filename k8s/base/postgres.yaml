apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: k8s-vault-demo
data:
  001-bootstrap.sh: |
    #!/usr/bin/env bash
    set -Eeuo pipefail

    psql -v ON_ERROR_STOP=1 \
      --username "${POSTGRES_USER}" \
      --dbname "${POSTGRES_DB}" \
      --set=bootstrap_password="${TODO_BOOTSTRAP_PASSWORD}" <<'EOSQL'
    DO
    $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'todo_app') THEN
            CREATE ROLE todo_app NOLOGIN;
        END IF;
    END
    $$;

    GRANT CONNECT, TEMPORARY ON DATABASE todo TO todo_app;
    REVOKE CREATE ON SCHEMA public FROM PUBLIC;
    ALTER SCHEMA public OWNER TO todo_app;
    GRANT USAGE, CREATE ON SCHEMA public TO todo_app;

    SELECT format('CREATE ROLE todo_bootstrap WITH LOGIN PASSWORD %L', :'bootstrap_password')
    WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'todo_bootstrap') \gexec
    SELECT format('ALTER ROLE todo_bootstrap WITH LOGIN PASSWORD %L', :'bootstrap_password') \gexec
    GRANT todo_app TO todo_bootstrap;
    ALTER ROLE todo_bootstrap SET ROLE TO 'todo_app';
    EOSQL
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: k8s-vault-demo
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: k8s-vault-demo
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: k8s-vault-demo
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: todo
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-admin
                  key: password
            - name: TODO_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-database-credentials
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -d todo"]
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -d todo"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
