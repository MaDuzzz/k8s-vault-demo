apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: external-vault
spec:
  # Patch this placeholder with the Vault address reachable from VSO Pods.
  address: http://192.168.180.192:8200
  skipTLSVerify: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: todo-vso-auth-x
spec:
  vaultConnectionRef: external-vault
  method: kubernetes
  mount: k-vso
  kubernetes:
    role: todo-app-roles
    serviceAccount: todo-vso-auth
    audiences:
      - vault
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: todo-database
spec:
  vaultAuthRef: todo-vso-auth-x
  mount: todo-db
  path: creds/todo-db-roles
  renewalPercent: 67
  revoke: true
  destination:
    create: false
    name: todo-database-credentials
    transformation:
      templates:
        managed_by:
          text: vso
