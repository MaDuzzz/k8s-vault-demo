apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: external-vault
spec:
  # Patch this placeholder with the Vault address reachable from VSO Pods.
  address: https://vault.example.invalid:8200
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: todo-vso-auth
spec:
  vaultConnectionRef: external-vault
  method: kubernetes
  mount: kubernetes-vso
  kubernetes:
    role: todo-app
    serviceAccount: todo-vso-auth
    audiences:
      - vault
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: todo-database
spec:
  vaultAuthRef: todo-vso-auth
  mount: b_lab
  path: creds/todo-app
  renewalPercent: 67
  revoke: true
  destination:
    create: false
    transformation:
      templates:
        managed_by:
          text: vso
