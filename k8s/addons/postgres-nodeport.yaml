# Optional lab-only exposure so an external Vault cluster can reach PostgreSQL.
# Prefer a private LoadBalancer or routed ClusterIP in real environments.
apiVersion: v1
kind: Service
metadata:
  name: postgres-vault
  namespace: vault-demo
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: k8s-vault-demo
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      nodePort: 30432
