server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: vault-todo-backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 30s

app:
  database:
    url: ${DB_URL:}
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    name: ${DB_NAME:todo}
    ssl-mode: ${DB_SSL_MODE:disable}
    maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
    minimum-idle: ${DB_POOL_MIN_IDLE:1}
    connection-timeout: ${DB_CONNECTION_TIMEOUT:5s}
    validation-timeout: ${DB_VALIDATION_TIMEOUT:3s}
    max-lifetime: ${DB_POOL_MAX_LIFETIME:25m}
    drain-grace-period: ${DB_POOL_DRAIN_GRACE:30s}
  database-credential:
    username-file: ${DB_CREDENTIAL_USERNAME_FILE:/var/run/secrets/database-credentials/username}
    password-file: ${DB_CREDENTIAL_PASSWORD_FILE:/var/run/secrets/database-credentials/password}
    provider-file: ${DB_CREDENTIAL_PROVIDER_FILE:/var/run/secrets/database-credentials/managed_by}
    destination-secret-name: ${DB_CREDENTIAL_SECRET_NAME:todo-database-credentials}
    startup-timeout: ${DB_CREDENTIAL_STARTUP_TIMEOUT:30s}
    poll-interval: ${DB_CREDENTIAL_POLL_INTERVAL:2s}
    lease-duration: ${DB_CREDENTIAL_LEASE_DURATION:30s}
    renewal-percent: ${DB_CREDENTIAL_RENEWAL_PERCENT:67}
    max-credential-ttl: ${DB_CREDENTIAL_MAX_TTL:2m}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,databaseCredentials,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    com.zaxxer.hikari: INFO
